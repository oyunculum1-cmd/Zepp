name: APK derle

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Derle
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Zapp-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Release olarak yayinla (TV'den link ile indirmek icin)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "app/build/outputs/apk/debug/app-debug.apk#Zapp.apk" --title "Zapp son sürüm" --notes "Otomatik derleme" --target "${{ github.sha }}"
